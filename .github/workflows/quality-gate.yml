name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-eval:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Create API environment
        shell: pwsh
        run: |
          python -m venv .venv311
          .venv311\Scripts\python.exe -m pip install -r server\requirements-dev.txt
      - name: Run release quality gate
        run: npm run quality:gate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            artifacts/evals/0.5.2-agent-fake-eval.*
            artifacts/performance/0.7.0-api-baseline.*
          if-no-files-found: error

  dependency-security:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-build.txt
            server/requirements-quality.txt
      - name: Install audit tools
        shell: pwsh
        run: |
          npm ci
          python -m venv .venv-quality
          .venv-quality\Scripts\python.exe -m pip install -r server\requirements-quality.txt
      - name: Audit dependencies and generate SBOMs
        run: npm run quality:security
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-security
          path: artifacts/security/
          if-no-files-found: error
